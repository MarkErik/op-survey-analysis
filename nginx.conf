user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  45;

    # Trust your upstream proxy
    set_real_ip_from 172.19.0.0/16; 
    real_ip_header X-Real-IP;

    # --- Rate Limiting Configuration ---
    # Zone for login page rate limiting (10 requests per minute)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    
    # Zone for general rate limiting (30 requests per second)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    server {
        listen 80;
        listen [::]:80;

        # Protect dotfiles
        location ~ /\. { deny all; access_log off; log_not_found off; }

        # robots.txt (served by nginx, not a file)
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Ignore common 404s
        location = /favicon.ico { access_log off; log_not_found off; }

        # Login page - apply stricter rate limiting
        location ~ ^/(login|api/login) {
            limit_req zone=login_limit burst=5 nodelay;
            
            proxy_pass_header       Server;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto https;
            proxy_set_header        X-Scheme https;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-NginX-Proxy true;
            proxy_connect_timeout   5;
            proxy_read_timeout      240;
            proxy_intercept_errors  on;

            proxy_pass              http://shinyproxy:8080;
        }

        # All other requests - general rate limiting
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            
            proxy_pass_header       Server;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto https;
            proxy_set_header        X-Scheme https;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-NginX-Proxy true;
            proxy_set_header        Upgrade $http_upgrade;
            proxy_set_header        Connection "upgrade";
            proxy_http_version      1.1;
            proxy_connect_timeout   5;
            proxy_read_timeout      86400;
            proxy_send_timeout      86400;
            proxy_intercept_errors  on;

            proxy_pass              http://shinyproxy:8080;
        }
    }
}
