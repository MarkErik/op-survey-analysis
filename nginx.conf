user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log crit;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging is disabled as per your original config.
    access_log off;

    sendfile        on;
    keepalive_timeout  45;

    # --- Rate Limiting Configuration ---
    # This remains, as it's a direct defense against brute-force attacks
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    server {
        listen 80;
        listen [::]:80;

        # protect dotfiles
        location ~ /\. { deny all; error_log off; log_not_found off; }

        # robots.txt (served by nginx, not a file)
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # ignore common 404s
        location = /favicon.ico { access_log off; log_not_found off; }

        location / {
            # --- Basic Authentication ---
            auth_basic "Restricted Shiny App";
            auth_basic_user_file /etc/nginx/htpasswd;

            # --- Rate Limiting ---
            limit_req zone=mylimit burst=20 nodelay;

            proxy_pass_header       Server;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Scheme $scheme;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-NginX-Proxy true;
            proxy_connect_timeout   5;
            proxy_read_timeout      240;
            proxy_intercept_errors  on;

            # Update this to point to your R Shiny app service name and port
            proxy_pass              http://shiny_app:7008; 
        }
    }
}
