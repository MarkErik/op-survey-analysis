proxy:
  title: OP Survey Analysis
  logo-url: https://www.openanalytics.eu/shinyproxy/logo.png
  landing-page: /
  heartbeat-rate: 10000
  heartbeat-timeout: 60000
  port: 8080
  authentication: simple
  admin-groups: admins
  
  # Simple file-based authentication
  authentication-simple:
    users:
    - name: admin
      password: admin
      roles: ADMIN
    - name: user
      password: user
      roles: USER
  
  # Docker configuration
  docker:
    internal-networking: true
    port-range-start: 20000
    network: internal_op_shiny
  
  # Application definition
  specs:
  - id: op-survey
    display-name: OP Survey Analysis
    description: Survey data analysis application
    container-cmd: ["R", "-e", "shiny::runApp('/srv/shiny-server')"]
    container-image: op_shiny
    container-network: internal_op_shiny
