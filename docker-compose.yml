services:
  shiny-app:
    build: .
    ports:
      - "7008:7008"
    volumes:
      # Bind mount for survey data (host path to container path)
      - ./survey_data:/srv/shinyapp/survey_data
      # Optional: bind mount for any additional data files (remove or replace with actual path)
      # - /path/to/your/data/on/host:/srv/shinyapp/custom_data
    environment:
      - SHINY_PORT=7008
    restart: unless-stopped
    
  # Optional: Add a database service if needed in the future
  # postgres:
  #   image: postgres:13
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_PASSWORD=yourpassword
  #   restart: unless-stopped