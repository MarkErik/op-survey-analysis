services:
  op_shiny:
    build:
      context: .
    image: op_shiny
    container_name: op_shiny
    restart: unless-stopped
    volumes:
      # Bind mount for survey data (host path to container path)
      - ./survey_data:/srv/shinyapp/survey_data
    networks:
      - default
  
  shinyproxy:
    image: openanalytics/shinyproxy:latest
    container_name: shinyproxy
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./application.yml:/opt/shinyproxy/application.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - VIRTUAL_HOST
      - LETSENCRYPT_HOST
      - LETSENCRYPT_EMAIL
    networks:
      - default
      - outside

networks:
  default:
    external:
      name: internal_op_shiny
  outside:
    external:
      name: connect-to-proxy
